<!DOCTYPE html>
<html lang="ku" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">

<title>C# Laboratory – Lab 1-4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-anchor:none}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;direction:rtl}
.container{max-width:1200px;margin:0 auto}
.labs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:0 auto 16px;direction:ltr}
.lab{padding:8px 8px;background:#16a34a;border:2px solid #15803d;border-radius:10px;color:#fff;cursor:pointer;font-size:15px;font-weight:900;font-family:inherit;letter-spacing:.4px;box-shadow:0 3px 9px rgba(0,0,0,.28);transition:all .25s}
.lab:hover{background:#22c55e;transform:translateY(-2px)}
.lab.active{background:#14532d;border-color:#fff;box-shadow:0 0 0 2px #22c55e,0 4px 12px rgba(0,0,0,.4)}
.labs-hr{border:0;height:2px;background:rgba(255,255,255,.55);border-radius:2px;max-width:360px;margin:0 auto 16px}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.tab{padding:12px 22px;background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:15px;font-weight:bold;transition:all .3s;backdrop-filter:blur(10px)}
.tab:hover{background:rgba(255,255,255,.3);transform:translateY(-2px)}
.tab.active{background:#fff;color:#667eea;box-shadow:0 4px 15px rgba(0,0,0,.2)}
.content{display:none}.content.active{display:block;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.example{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.title-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.example-title{flex:1;background:linear-gradient(135deg,#e0f2fe,#bae6fd);padding:14px 18px;border-radius:8px;font-size:17px;font-weight:bold;color:#0c4a6e}
.pdf-page{background:#f97316;color:#fff;font-size:11px;font-weight:bold;padding:5px 11px;border-radius:20px;white-space:nowrap;direction:ltr;box-shadow:0 2px 6px rgba(249,115,22,.35)}
.code-box{background:#1e1e1e;border-radius:10px;margin-bottom:18px;overflow:hidden;border:1px solid #333;display:flex;direction:ltr}
.line-numbers{background:#2d2d2d;border-left:4px solid #5cb85c;padding:18px 0;min-width:42px;text-align:center;font-family:Consolas,Monaco,monospace;font-size:15px;color:#858585;line-height:1.7;user-select:none;flex-shrink:0}
.line-numbers span{display:block;padding:0 8px}
.code-content{padding:18px 20px;overflow-x:auto;flex:1}
.code-content pre{font-family:Consolas,Monaco,monospace;line-height:1.7;white-space:pre;color:#e2e8f0;font-size:15px;text-align:left}
.kw{color:#d4a574;font-weight:700}.dt{color:#bb86fc;font-weight:700}.con{color:#4fc3f7;font-weight:600}.num{color:#b5cea8}.str{color:#ce9178}.cmt{color:#6a9955;font-style:italic}
.output-box{background:linear-gradient(135deg,#dbeafe,#bfdbfe);border:2px solid #3b82f6;border-radius:8px;padding:14px 18px;margin-bottom:18px;direction:ltr;overflow-x:auto}
.output-header{font-weight:bold;color:#1e40af;margin-bottom:8px;font-size:15px}
.output-content{color:#1e3a8a;font-family:Consolas,monospace;font-size:14px;line-height:1.8;white-space:pre;text-align:left}
.expl-box{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1.5px solid #86efac;border-right:6px solid #22c55e;border-radius:14px;padding:22px 24px}
.expl-title{font-weight:800;color:#166534;margin-bottom:14px;font-size:16px;border-bottom:2px dashed #86efac;padding-bottom:10px}
.expl-box ul{list-style:none}
.expl-box li{margin-bottom:11px;line-height:2;font-size:15px;color:#1c1917;padding:10px 14px;background:#fff;border-radius:9px;border-right:4px solid #22c55e;display:flex;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.rng{flex-shrink:0;min-width:36px;height:24px;line-height:22px;text-align:center;background:#dcfce7;color:#166534;font-weight:800;border:1.5px solid #22c55e;border-radius:5px;padding:0 6px;font-size:13px;margin-top:6px}.sn{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;font-size:13px;display:inline-block;max-width:100%;overflow-x:auto;white-space:nowrap;vertical-align:middle}.sn.sm{font-size:10px}
.ln{background:#22c55e;color:#fff;font-weight:700;font-size:13px;padding:0 10px;border-radius:20px;height:26px;line-height:26px;flex-shrink:0;margin-top:5px;direction:ltr}
.expl-box b{color:#0369a1;background:#dbeafe;padding:1px 7px;border-radius:5px;direction:ltr;display:inline-block;font-family:Consolas,monospace;font-size:13px}
.expl-box code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.intro{background:#fff;border-radius:12px;padding:30px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.intro h2{color:#667eea;margin-bottom:18px;font-size:1.9em}.intro p{color:#4b5563;line-height:1.8;margin-bottom:12px}
.expl-box li{flex-direction:column;align-items:flex-start;gap:6px}
.expl-box li>span:last-child{width:100%}
.expl-box .rng{min-width:30px;height:20px;line-height:18px;font-size:12px;padding:0 5px;border-radius:4px;margin-top:0}
.expl-box .sn{display:block;width:fit-content;max-width:100%;margin-bottom:6px;white-space:pre;text-align:left}
.expl-box .sn{overflow:visible;overflow-x:visible;white-space:normal;overflow-wrap:anywhere}
.sn.xs{font-size:8px}
.cls{color:#4ec9b0}.fn{color:#dcdcaa}.var{color:#9cdcfe}.op{color:#ff79c6}
.more-btn{display:block;width:100%;margin-top:16px;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(102,126,234,.35)}
.more-panel{display:none;margin-top:14px;background:#f5f3ff;border:1.5px solid #c4b5fd;border-right:6px solid #7c3aed;border-radius:14px;padding:20px}
.more-panel.open{display:block;animation:fadeIn .4s}
.more-title{font-weight:800;color:#5b21b6;font-size:16px;margin-bottom:10px}
.more-intro,.more-sum{line-height:2;color:#1c1917;font-size:15px;margin-bottom:14px}
.more-panel code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.st{background:#fff;border:1.5px solid #ddd6fe;border-right:5px solid #7c3aed;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.st-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.st-h .rng{margin-top:0;min-width:30px;height:20px;line-height:18px;font-size:12px;padding:0 5px;border-radius:4px}
.st-h .sn{white-space:normal;overflow:visible;overflow-wrap:anywhere;background:#dbeafe;color:#0369a1;padding:1px 7px;border-radius:5px}
.st p{line-height:2;font-size:15px;color:#1c1917;margin-bottom:8px}
.st-v{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:#6b7280}
.vs{font-style:normal;background:#ede9fe;color:#4c1d95;border-radius:6px;padding:1px 8px;font-family:Consolas,monospace;direction:ltr;font-size:13px;font-weight:700}
.st p{font-size:16px;line-height:2.1}
.walk{background:#fff;border:1.5px solid #86efac;border-radius:10px;padding:12px 14px;margin-bottom:14px;line-height:2;font-size:15px;color:#1c1917}.more-panel .walk{border-color:#c4b5fd;margin-bottom:14px}
.walk .wl{display:block;font-weight:800;color:#166534;margin-bottom:4px}.more-panel .walk .wl{color:#5b21b6}
.walk code{background:#1e1e1e;color:#ce9178;padding:2px 7px;border-radius:5px;font-size:13px;font-family:Consolas,monospace;direction:ltr;display:inline-block}
.expl-box .rng,.st-h .rng{min-width:0;padding:0 8px;white-space:nowrap}
.code-box.pinned{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;max-height:42vh;overflow:auto;align-items:flex-start;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.code-box.pinned .line-numbers{font-size:12px}.code-box.pinned .code-content pre{font-size:12px}
.container{padding-bottom:80px}
.pin-wrap{display:none;position:fixed;left:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:100;flex-direction:column;align-items:flex-start;gap:8px;direction:ltr}
.pin-wrap.show{display:flex}
.pin-pill{background:#fff;color:#111;font:600 15px 'Segoe UI',Tahoma,sans-serif;padding:8px 14px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.pin-fab{width:58px;height:58px;border:none;border-radius:18px;background:#7c3aed;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(0,0,0,.35);cursor:pointer}
.pin-wrap.on .pin-fab{background:#1fa855}.pin-wrap.on svg path:last-child{fill:#fff}
.code-box.pinned.wide{width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);border-radius:0;border-left:0;border-right:0}
.pin-fab{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.code-box.pinned{position:fixed;margin:0}
.code-box.pinned.wide{left:0;width:100vw;margin:0;border-radius:0;border-left:0;border-right:0}
.pin2 .pin-fab{background:#dc2626}.pin2.on .pin-fab{background:#f97316}
.code-box.pinned.dim{visibility:hidden}
.output-box{padding:7px 12px;border-width:1.5px;border-radius:6px;margin-bottom:12px}
.output-header{font-size:12px;margin-bottom:3px}
.output-content{font-size:11px;line-height:1.5}
.st-h{flex-direction:column;align-items:flex-start;gap:6px}
.pin-fab{box-sizing:border-box;outline:none;-webkit-tap-highlight-color:transparent}
.pin-fab svg{transition:transform .2s}
.pin-wrap.full .pin-fab{border:4px solid #7c3aed}
.pin2.full .pin-fab{border-color:#dc2626}
.pin-wrap.full svg{transform:rotate(45deg)}
.usr{color:#fff;font-weight:800}
.pin-wrap.dock{left:0}
.pin-wrap.dock .pin-fab{opacity:.45;transform:translateX(-32px)}
.pin-wrap.dock .pin-pill{opacity:0;pointer-events:none}
.pin-fab{transition:transform .2s ease,background .2s,opacity .2s}
.pin-fab{touch-action:none;transition:transform .2s ease,background .2s}
.pin-fab.drag{transition:none;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.pin-pill{transition:background .15s,color .15s}
.pin-pill{white-space:nowrap;max-width:calc(100vw - 24px);font-size:13px;line-height:1.6;padding:8px 12px}
.pin-pill.hint{background:#7c3aed;color:#fff}.pin2 .pin-pill.hint{background:#dc2626}
.fb-box{margin-top:26px;padding:22px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:1.5px solid #c4b5fd;border-radius:14px;text-align:right}
.fb-title{font-weight:800;color:#5b21b6;font-size:17px;margin-bottom:6px}
.fb-sub{color:#6b5b95;font-size:13.5px;margin-bottom:14px;line-height:1.8}
.fb-quick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.fb-qbtn{flex:1;min-width:140px;padding:10px 14px;border:1.5px solid #ddd6fe;background:#fff;border-radius:10px;color:#5b21b6;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;transition:.2s}
.fb-qbtn:hover{background:#ede9fe;border-color:#a78bfa}
.fb-overlay{display:none;position:fixed;inset:0;background:rgba(17,12,34,.55);z-index:200;align-items:center;justify-content:center;padding:20px}
.fb-overlay.open{display:flex}
.fb-dialog{background:#fff;border-radius:16px;padding:22px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center}
.fb-dialog h3{color:#5b21b6;font-size:17px;margin-bottom:14px}
.fb-dialog .fb-qbtn{width:100%;margin-bottom:10px;text-align:center}
.fb-dialog-cancel{width:100%;padding:10px;border:none;background:#f3f4f6;color:#4b5563;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-top:4px}
.fb-area{width:100%;min-height:84px;padding:12px 14px;border:1.5px solid #ddd6fe;border-radius:10px;font-family:inherit;font-size:14.5px;resize:vertical;color:#1c1917;box-sizing:border-box;margin-bottom:12px}
.fb-area:focus{outline:none;border-color:#7c3aed}
.fb-send{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(102,126,234,.3)}
.fb-send:hover{filter:brightness(1.07)}
.fb-send:disabled{opacity:.6;cursor:default}
.fb-send2{background:linear-gradient(135deg,#f97316,#ea580c);box-shadow:0 4px 12px rgba(234,88,12,.3);margin-top:10px}
.fb-msg{margin-top:10px;text-align:center;font-size:13.5px;font-weight:700;border-radius:8px;padding:9px;display:none}
.fb-msg.ok{display:block;background:#dcfce7;color:#166534}
.fb-msg.err{display:block;background:#fee2e2;color:#991b1b}
.code-box.has-tools{flex-wrap:wrap}
.code-tools{flex:0 0 100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 10px;background:linear-gradient(180deg,#2f2f35,#26262b);border-bottom:1px solid #3b3b44;position:sticky;top:0;z-index:3;direction:ltr}
.ct-l{display:flex;align-items:center;gap:6px}
.ct-l i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5f56}
.ct-l i:nth-child(2){background:#ffbd2e}.ct-l i:nth-child(3){background:#27c93f}
.ct-l b{margin-left:8px;color:#9ca3af;font:600 12px Consolas,monospace;letter-spacing:.5px}
.ct-r{display:flex;align-items:center;gap:10px}
.copy-btn{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.08);color:#e5e7eb;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s;-webkit-tap-highlight-color:transparent}
.copy-btn:hover{background:rgba(255,255,255,.16)}
.copy-btn.done{background:rgba(34,197,94,.22);border-color:#4ade80;color:#86efac}
.ku-sw{display:flex;align-items:center;gap:8px;padding:0 10px 0 4px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.06);font-weight:700;font-size:13px;color:#cbd5e1;cursor:pointer;user-select:none;direction:rtl;-webkit-tap-highlight-color:transparent;transition:background .25s,border-color .25s,color .25s}
.ku-sw:has(input:checked){background:rgba(59,130,246,.2);border-color:#60a5fa;color:#93c5fd}
.ku-sw input{display:none}
.ku-sw .sw{position:relative;display:inline-block;width:36px;height:12px;margin:5px 4px;border-radius:6px;background:#475569;transition:background .25s;direction:ltr}
.ku-sw .sw::after{content:'';position:absolute;top:-4px;left:-3px;width:20px;height:20px;border-radius:50%;background:#94a3b8;box-shadow:0 2px 5px rgba(0,0,0,.45);transition:left .25s,background .25s,box-shadow .25s}
.ku-sw input:checked+.sw{background:#1e40af}
.ku-sw input:checked+.sw::after{left:19px;background:#3b82f6;box-shadow:0 0 12px rgba(59,130,246,.85)}
.code-box.pinned .code-tools{padding:1px 8px}.code-box.pinned .ct-l i{display:none}
@media(max-width:480px){.ct-l{display:none}.code-tools{padding:2px 6px;justify-content:center}.ct-r{flex-wrap:nowrap;justify-content:center;gap:4px;max-width:100%}.copy-btn{padding:2px 7px;font-size:11px;white-space:nowrap;gap:3px}.ku-sw{font-size:11px;gap:3px;padding:0 6px 0 1px;white-space:nowrap}.ku-sw .sw{width:22px;height:8px;margin:5px 2px;border-radius:4px}.ku-sw .sw::after{top:-4px;left:-2px;width:16px;height:16px}.ku-sw input:checked+.sw::after{left:8px}}
.req{line-height:2;font-size:13px;color:#1c1917;margin:10px 0 18px}
.req b{font-size:15px}

.example.wide5 .expl-box{padding:16px 12px}
.example.wide5 .expl-box li{padding:9px 11px}

body.wide5 .more-panel{padding:16px 12px}

body.wide5 .intro{padding:30px 20px}
.example > .code-box{margin-bottom:38px}
.expl-box .walk{font-size:13px}
.expl-box .walk .wl{font-size:13px}
.code-box.pinned .ct-r{flex-wrap:nowrap;gap:4px}
.code-box.pinned .copy-btn{padding:2px 7px;font-size:11px;white-space:nowrap}
.code-box.pinned .ku-sw{font-size:11px;gap:3px;padding:0 6px 0 1px;white-space:nowrap}

.chat-head{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:130;width:50px;height:50px;border:3px solid #fff;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#2563eb);display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .2s,background .3s}

.chat-head:active{transform:scale(.88)}
.chat-head.min{background:linear-gradient(135deg,#f97316,#dc2626);animation:chPulse 1.6s infinite}
@keyframes chPulse{0%{box-shadow:0 0 0 0 rgba(249,115,22,.65)}100%{box-shadow:0 0 0 16px rgba(249,115,22,0)}}
.code-full{position:fixed;top:48px;left:0;right:0;bottom:0;z-index:120;background:#1e1e1e;display:none;overflow-y:auto;overflow-x:hidden;direction:ltr;-webkit-overflow-scrolling:touch}
.code-full{touch-action:pan-x pan-y}
#cz{position:relative}
.code-full.open{display:block;animation:fadeIn .25s}
.zoom-bar{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:130;align-items:center;gap:4px;background:rgba(45,45,45,.95);border:2px solid #fff;border-radius:26px;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.45);direction:ltr}
.zoom-bar.show{display:flex}
.zoom-bar button{width:40px;height:40px;border:none;border-radius:50%;background:#7c3aed;color:#fff;font:700 24px/1 Consolas,monospace;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.zoom-bar button:active{background:#5b21b6}
.zoom-bar span{min-width:30px;text-align:center;color:#fff;font:700 14px Consolas,monospace}

 ئەوەی بەکارهێنەر نووسیویەتی دەخاتە ناو ch؛ بۆ نموونە A. هەر پیتێک ژمارەیەکی ASCIIی هەیە: A = 65. <code>ch++</code> یەک زیاد دەکات بۆ ئەو ژمارەیە: 65 + 1 = 66، کە پیتی B ـە، بۆیە ch دەبێتە B. لە کۆتاییدا <code>WriteLine</code> دەقەکە لەگەڵ ch دەلکێنێت: Next character is: B.',

'سەرەتا نمرەی قوتابی دەخوێنێتەوە لە <code>score</code>؛ بۆ نموونە 75. دواتر <code>range = score / 10</code>: 75 / 10، و چونکە هەردووکیان <code>int</code>ن، ئەنجامەکە ژمارەی تەواوە، 7 (بەشی دەهەمی نامێنێت). <code>switch (range)</code> بەهای 7 لەگەڵ caseـەکان بەراورد دەکات: 0 و 1 و 2 و 3 و 4 و 5 و 6 یەکسان نین، بەڵام case 7 یەکسانە، بۆیە Estimation: Good چاپ دەکرێت و <code>break</code> لە switch دەردەچێت. بۆیە case 8 و 9 و 10 و <code>default</code> نابینرێن. caseـە لەسەریەکەکان (0 تا 4، و 9 و 10) هەمان کۆد هاوبەش دەکەن، چونکە <code>break</code> لە نێوانیاندا نییە. <code>default</code> بۆ کاتێکە کە range لەدەرەوەی 0 تا 10 بێت.'], "MORE": [{"c": "char ch = 'D';\nch--;\nConsole.WriteLine(ch);", "o": "C", "intro": "سەرەتا گۆڕاوی <code>ch</code>مان دروست کرد بە جۆری <code>char</code> و پیتی Dمان تێدا دانا. دواتر <code>ch--</code> کردی بە پیتی پێشوو، واتە C. لە کۆتاییدا بە <code>Console.WriteLine</code> بەهای chمان چاپ کرد: C.", "s": [["char ch = 'D';", "گۆڕاوی <code>ch</code> دروست دەکات لە جۆری <code>char</code> (یەک پیت) و پیتی D دەخاتە ناوی. ASCIIـی D ئەوە 68ـە.", ["ch = D"]], ["ch--;", "<code>ch--</code> یەک کەم دەکات لە ژمارەی ASCIIـی ch: 68 دەبێتە 67، و 67 پیتی C ـە.", ["ch = C"]], ["Console.WriteLine(ch);", "<code>Console.WriteLine</code> بەهای ئێستای ch چاپ دەکات، بۆیە C دەبینین.", []]], "sum": "پوختە: <code>--</code> لەسەر <code>char</code> پیتەکە دەگۆڕێت بۆ پیتی پێشوو."}, {"c": "int mark = 55;\nif (mark >= 50)\n  Console.WriteLine(\"Pass\");\nelse\n  Console.WriteLine(\"Fail\");", "o": "Pass", "intro": "سەرەتا گۆڕاوی <code>mark</code>مان دروست کرد بە جۆری <code>int</code> و بەهای 55ـمان پێدا. دواتر بە <code>if</code> پشکنیمان: 55 گەورەترە یان یەکسانە بە 50؟ بەڵێ، بۆیە <code>Console.WriteLine</code> دەقی Pass چاپ دەکات و <code>else</code> ناپشکنرێت.", "s": [["int mark = 55;", "گۆڕاوی <code>mark</code> دروست دەکات لە جۆری <code>int</code> و بەهای 55ی دەداتێ.", ["mark = 55"]], ["if (mark >= 50)", "55 گەورەترە یان یەکسانە بە 50؟ بەڵێ، True. بۆیە هێڵی دواتر جێبەجێ دەبێت.", []], ["Console.WriteLine(\"Pass\");", "<code>Console.WriteLine</code> دەقی Pass چاپ دەکات.", []], ["else", "<code>else</code> واتە ئەگەرنا؛ چونکە مەرجی if ڕاست بوو، ئەم بەشە ناپشکنرێت.", []], ["Console.WriteLine(\"Fail\");", "ئەگەر mark کەمتر بووایە لە 50، دەقی Fail چاپ دەکرا.", []]], "sum": "پوختە: <code>if</code> یەکەم مەرجی ڕاست هەڵدەگرێت و <code>else</code> بۆ کاتی هەڵەیە."}, {"c": "int d = 7;\nint r = d / 2;\nswitch (r)\n{\n  case 3:\n  case 4:\n    Console.WriteLine(\"Big\");\n    break;\n  default:\n    Console.WriteLine(\"Small\");\n    break;\n}", "o": "Big", "intro": "سەرەتا گۆڕاوی <code>d</code>مان دروست کرد بە بەهای 7. دواتر <code>r</code>مان دروست کرد و 7 / 2 کە لە <code>int</code> دا 3 دەدات تێیدا دانا. بە <code>switch</code> بەهای r (3) بەراورد دەکرێت: case 3 یەکسانە و case 4 هەمان کۆد هاوبەش دەکات، بۆیە Big چاپ دەکرێت و <code>break</code> دەردەچێت.", "s": [["int d = 7;", "گۆڕاوی <code>d</code> دروست دەکات لە جۆری <code>int</code> و بەهای 7ی دەداتێ.", ["d = 7"]], ["int r = d / 2;", "7 / 2 لە <code>int</code> دا 3 دەدات (بەشی دەهەمی نامێنێت). 3 دەخاتە ناو r.", ["r = 3"]], ["switch (r)", "switch بەهای r (3) هەڵدەگرێت و لەگەڵ case ـەکان بەراوردی دەکات.", []], ["case 3:", "3 یەکسانە بە 3؟ بەڵێ. لەبەر ئەوەی case 3 کۆدی نییە، کۆدی case 4 بەکاردێت.", []], ["case 4:", "ئەم case ـە هەمان کۆدی case 3 هاوبەش دەکات. ئەگەر r 4 بووایە، هەمان ئەنجام دەبوو.", []], ["Console.WriteLine(\"Big\");", "<code>Console.WriteLine</code> دەقی Big چاپ دەکات.", []], ["break;", "<code>break</code> لە switch دەردەچێت.", []], ["default:", "ئەگەر r نە 3 نە 4 بووایە، کۆد لێرەوە دەست پێدەکرد.", []], ["Console.WriteLine(\"Small\");", "ئەگەر default بگیرایە، Small چاپ دەکرا.", []], ["break;", "ئەگەر default بگیرایە، <code>break</code> لە switch دەردەچوو.", []]], "sum": "پوختە: چەند caseـێک دەتوانن یەک کۆد هاوبەش بکەن بە نەنووسینی break لە نێوانیان."}]});
ADD(3,{"E": [{"t": "Sum with Loop – کۆکردنەوە بە لووپ", "p": "PDF P.1", "q": "<b>داواکاری:</b> بەرنامەیەک بنووسە کە ژمارەیەکی تەواوی ئەرێنی لە بەکارهێنەر بپرسێت. بەرنامەکە بە لووپێک کۆی هەموو ژمارە تەواوەکان لە 1 تا ئەو ژمارەیەی نووسراوە بدۆزێتەوە. بۆ نموونە ئەگەر بەکارهێنەر 50 بنووسێت، لووپەکە کۆی 1 و 2 و 3 و 4 و ... هەتا 50 دەدۆزێتەوە. (بە لووپ)", "c": "int Value,sum=0;\nConsole.WriteLine(\"Enter the Value\" );\nValue =Convert.ToInt32( Console.ReadLine());\nfor (int i = 1; i <= Value; i++)\n  sum += i;\nConsole.WriteLine(\"the sum of all values is: \"+sum);", "o": "Enter the Value\n5\nthe sum of all values is: 15"}, {"t": "Sum with void Method – کۆکردنەوە بە میسۆدی void", "p": "PDF P.1", "q": "<b>داواکاری:</b> بەرنامەیەک بنووسە کە ژمارەیەکی تەواوی ئەرێنی لە بەکارهێنەر بپرسێت. بەرنامەکە بە لووپێک کۆی هەموو ژمارە تەواوەکان لە 1 تا ئەو ژمارەیەی نووسراوە بدۆزێتەوە. بۆ نموونە ئەگەر بەکارهێنەر 50 بنووسێت، لووپەکە کۆی 1 و 2 و 3 و 4 و ... هەتا 50 دەدۆزێتەوە. (بە میسۆدی <code>void</code>)", "c": "static void printsum(int v)\n{\n  int sum = 0;\n  for (int i = 1; i <= v; i++)\n    sum += i;\n  Console.WriteLine(\"the sum of all values is: \" + sum);\n}\nstatic void Main(string[] args)\n{\n  int Value;\n  Console.WriteLine(\"Enter the Value\");\n  Value = Convert.ToInt32(Console.ReadLine());\n  printsum(Value);\n}", "o": "Enter the Value\n5\nthe sum of all values is: 15"}, {"t": "Sum with int Method – کۆکردنەوە بە میسۆدی int", "p": "PDF P.2", "q": "<b>داواکاری:</b> بەرنامەیەک بنووسە کە ژمارەیەکی تەواوی ئەرێنی لە بەکارهێنەر بپرسێت. بەرنامەکە بە لووپێک کۆی هەموو ژمارە تەواوەکان لە 1 تا ئەو ژمارەیەی نووسراوە بدۆزێتەوە. بۆ نموونە ئەگەر بەکارهێنەر 50 بنووسێت، لووپەکە کۆی 1 و 2 و 3 و 4 و ... هەتا 50 دەدۆزێتەوە. (بە میسۆدی <code>int</code>)", "c": "static int printsum(int v)\n{\n  int sum = 0;\n  for (int i = 1; i <= v; i++)\n    sum += i;\n  return sum;\n}\nstatic void Main(string[] args)\n{\n  int Value;\n  Console.WriteLine(\"Enter the Value\");\n  Value = Convert.ToInt32(Console.ReadLine());\n  Console.WriteLine(\"the sum of all values is: \" + printsum(Value));\n}", "o": "Enter the Value\n5\nthe sum of all values is: 15"}], "EX": [[["int Value,sum=0;", "دوو گۆڕاوی <code>int</code> بە یەکجار دروست دەکات: <code>Value</code> (بەهای نییە) و <code>sum</code> کە بەهای 0ی دەداتێ."], ["Console.WriteLine(\"Enter the Value\" );", "دەقی Enter the Value چاپ دەکات بۆ ئەوەی بەکارهێنەر ژمارەیەک بنووسێت."], ["Value =Convert.ToInt32( Console.ReadLine());", "ئەوەی بەکارهێنەر دەینووسێت دەخوێنێتەوە و بە <code>Convert.ToInt32</code> دەیکات بە ژمارەی تەواو. ئەگەر 5 بنووسێت، Value = 5."], ["for (int i = 1; i <= Value; i++)", "i لە 1 دەست پێدەکات و تا i کەمتر یان یەکسان بێت بە Value (5) لووپەکە بەردەوامە، و هەر جارێک i یەک زیاد دەکات: 1 2 3 4 5."], ["sum += i;", "لە هەر دووبارەبوونەوەیەکدا i دەخاتە سەر sum: 0+1=1، 1+2=3، 3+3=6، 6+4=10، 10+5=15."], ["Console.WriteLine(\"the sum of all values is: \"+sum);", "دەقەکە لەگەڵ بەهای sum (15) بە <code>+</code> دەلکێنێت و چاپی دەکات."]], [["static void printsum(int v)", "میسۆدێک بە ناوی <code>printsum</code> دروست دەکات. <code>void</code> واتە هیچ بەهایەک ناگەڕێنێتەوە، و <code>int v</code> ئەو ژمارەیەیە کە پێی دەدرێت."], ["int sum = 0;", "گۆڕاوی <code>sum</code> دروست دەکات لە جۆری <code>int</code> و بەهای 0ی دەداتێ."], ["for (int i = 1; i <= v; i++)", "i لە 1 تا v (5) دووبارە دەبێتەوە: 1 2 3 4 5."], ["sum += i;", "هەر جارێک i دەخاتە سەر sum: 1 و 3 و 6 و 10 و 15."], ["Console.WriteLine(\"the sum of all values is: \" + sum);", "دەقەکە لەگەڵ sum (15) دەلکێنێت و خودی میسۆدەکە چاپی دەکات."], ["static void Main(string[] args)", "پرۆگرامەکە لێرەوە دەست پێدەکات؛ کۆدی ناو ئەم بلۆکە یەکەم جار جێبەجێ دەبێت."], ["int Value;", "گۆڕاوی <code>Value</code> دروست دەکات لە جۆری <code>int</code>. هێشتا بەهای نییە."], ["Console.WriteLine(\"Enter the Value\");", "دەقی Enter the Value چاپ دەکات."], ["Value = Convert.ToInt32(Console.ReadLine());", "ئەوەی بەکارهێنەر دەینووسێت دەخوێنێتەوە و دەیکات بە ژمارەی تەواو. ئەگەر 5 بنووسێت، Value = 5."], ["printsum(Value);", "میسۆدی <code>printsum</code> بانگ دەکات و بەهای Value (5) دەنێرێت بۆ v. میسۆدەکە خۆی کۆکەی دەدۆزێتەوە و 15 چاپ دەکات."]], [["static int printsum(int v)", "میسۆدێک بە ناوی <code>printsum</code> دروست دەکات. <code>int</code> واتە ژمارەیەکی تەواو دەگەڕێنێتەوە، و <code>int v</code> ئەو ژمارەیەیە کە پێی دەدرێت."], ["int sum = 0;", "گۆڕاوی <code>sum</code> دروست دەکات و 0ی دەداتێ."], ["for (int i = 1; i <= v; i++)", "i لە 1 تا v (5) دووبارە دەبێتەوە: 1 2 3 4 5."], ["sum += i;", "هەر جارێک i دەخاتە سەر sum: 1 و 3 و 6 و 10 و 15."], ["return sum;", "<code>return</code> بەهای sum (15) دەگەڕێنێتەوە بۆ ئەو شوێنەی میسۆدەکە لێوە بانگ کرابوو."], ["static void Main(string[] args)", "پرۆگرامەکە لێرەوە دەست پێدەکات؛ کۆدی ناو ئەم بلۆکە یەکەم جار جێبەجێ دەبێت."], ["int Value;", "گۆڕاوی <code>Value</code> دروست دەکات لە جۆری <code>int</code>. هێشتا بەهای نییە."], ["Console.WriteLine(\"Enter the Value\");", "دەقی Enter the Value چاپ دەکات."], ["Value = Convert.ToInt32(Console.ReadLine());", "ئەوەی بەکارهێنەر دەینووسێت دەخوێنێتەوە و دەیکات بە ژمارەی تەواو. ئەگەر 5 بنووسێت، Value = 5."], ["Console.WriteLine(\"the sum of all values is: \" + printsum(Value));", "سەرەتا <code>printsum(Value)</code> بانگ دەکرێت و 15 دەگەڕێتەوە. دواتر دەقەکە لەگەڵ 15 دەلکێت و <code>Console.WriteLine</code> چاپی دەکات."]]], "EXSUM": ['سەرەتا دوو گۆڕاوی <code>int</code> دروست دەکات: <code>Value</code> (هێشتا بەهای نییە) و <code>sum</code> بە بەهای 0. دواتر داوای ژمارە دەکات؛ بۆ نموونە 5: <code>ReadLine()</code> دەقی "5" دەخوێنێتەوە و <code>Convert.ToInt32</code> دەیکات بە 5 و دەیخاتە ناو Value. پاشان <code>for</code>: i لە 1 دەست پێدەکات و تا i &lt;= 5 لووپەکە دەمێنێتەوە. i = 1: sum = 0 + 1 = 1. i = 2: sum = 1 + 2 = 3. i = 3: sum = 3 + 3 = 6. i = 4: sum = 6 + 4 = 10. i = 5: sum = 10 + 5 = 15. کاتێک i دەبێتە 6، 6 &lt;= 5 هەڵەیە، False، و لووپەکە دەوەستێت. لە کۆتاییدا <code>WriteLine</code> دەقەکە لەگەڵ 15 دەلکێنێت: the sum of all values is: 15.',
'ئەم کۆدە دوو میسۆدی هەیە، و پرۆگرامەکە لە <code>Main</code> دەست پێدەکات. لە Main، گۆڕاوی <code>Value</code> دروست دەکات و داوای ژمارە دەکات؛ بۆ نموونە 5، و دەچێتە ناو Value. دواتر <code>printsum(Value)</code> بانگ دەکات و بەهای 5 دەنێرێت بۆ <code>v</code>ی میسۆدەکە. ئێستا لە ناو <code>printsum</code>: sum = 0، و لووپی i لە 1 تا 5 sum دەکات بە 1 و 3 و 6 و 10 و 15. چونکە میسۆدەکە <code>void</code>ـە، هیچ بەهایەک ناگەڕێنێتەوە، و خۆی چاپی دەکات: the sum of all values is: 15. دوای تەواوبوونی میسۆدەکە، پرۆگرام دەگەڕێتەوە بۆ Main و کۆتایی دێت.',
'ئەم کۆدەش دوو میسۆدی هەیە و لە <code>Main</code> دەست پێدەکات. لە Main، Value دروست دەکات و داوای ژمارە دەکات؛ بۆ نموونە 5. دواتر لە ناو <code>Console.WriteLine(...)</code>، سەرەتا <code>printsum(Value)</code> بانگ دەکرێت و 5 دەنێردرێت بۆ <code>v</code>. لە ناو <code>printsum</code>: sum = 0، و لووپی i لە 1 تا 5 sum دەکات بە 1 و 3 و 6 و 10 و 15. چونکە میسۆدەکە <code>int</code>ـە، <code>return sum</code> بەهای 15 دەگەڕێنێتەوە بۆ ئەو شوێنەی بانگ کرابوو. پاشان دەقەکە لەگەڵ 15 دەلکێت و <code>WriteLine</code> لە Main چاپی دەکات. جیاوازی لەگەڵ <code>void</code>: لێرە چاپکردنەکە لە Main دەکرێت و میسۆدەکە تەنها بەهایەک دەدات.'], "MORE": [{"c": "int f = 1;\nfor (int i = 1; i <= 4; i++)\n  f *= i;\nConsole.WriteLine(f);", "o": "24", "intro": "سەرەتا گۆڕاوی <code>f</code>مان دروست کرد بە بەهای 1. دواتر بە <code>for</code> i لە 1 تا 4 دووبارە دەبێتەوە و هەر جارێک f لێک دەدرێت بە i: 1 و 2 و 6 و 24. لە کۆتاییدا بە <code>Console.WriteLine</code> 24 چاپ دەکەین.", "s": [["int f = 1;", "گۆڕاوی <code>f</code> دروست دەکات لە جۆری <code>int</code> و بەهای 1ی دەداتێ. لە لێکدان 1 هەڵدەبژێردرێت، چونکە 0 هەموو شتێک دەکات بە 0.", ["f = 1"]], ["for (int i = 1; i <= 4; i++)", "i لە 1 دەست پێدەکات و تا i &lt;= 4 لووپەکە بەردەوامە؛ هەر جارێک i یەک زیاد دەکات: 1 2 3 4. کاتێک i دەبێتە 5 مەرجەکە هەڵەیە و لووپەکە دەوەستێت.", ["i = 1 ، 2 ، 3 ، 4"]], ["f *= i;", "هەر جارێک f لێک دەدات بە i: 1*1=1، 1*2=2، 2*3=6، 6*4=24.", ["f = 1 ، 2 ، 6 ، 24"]], ["Console.WriteLine(f);", "<code>Console.WriteLine</code> بەهای کۆتایی f چاپ دەکات: 24.", []]], "sum": "پوختە: لووپ دەتوانێت بەهاکان یەک بە یەک لێک بدات (<code>*=</code>) هەروەک چۆن کۆیان دەکاتەوە."}, {"c": "static void hello(string name)\n{\n  Console.WriteLine(\"Hi \" + name);\n}\nstatic void Main(string[] args)\n{\n  hello(\"Ali\");\n}", "o": "Hi Ali", "intro": "سەرەتا لە <code>Main</code> میسۆدی <code>hello</code>مان بانگ کرد و دەقی \"Ali\"مان نارد. میسۆدەکە لە جۆری <code>void</code>ـە و دەقەکە دەخاتە ناو <code>name</code>، دواتر Hi Ali چاپ دەکات.", "s": [["static void hello(string name)", "میسۆدێک دروست دەکات بە ناوی <code>hello</code>. <code>string name</code> ئەو دەقەیە کە پێی دەدرێت. <code>void</code> واتە هیچ نەدەگەڕێنێتەوە.", []], ["Console.WriteLine(\"Hi \" + name);", "لە ناو میسۆدەکە، \"Hi \" لەگەڵ name (Ali) دەلکێنێت و Hi Ali چاپ دەکات.", []], ["static void Main(string[] args)", "پرۆگرامەکە لێرەوە دەست پێدەکات.", []], ["hello(\"Ali\");", "میسۆدی hello بانگ دەکات و دەقی \"Ali\" دەنێرێت. ئێستا name = Ali.", ["name = Ali"]]], "sum": "پوختە: میسۆدی <code>void</code> کارێک دەکات (وەک چاپکردن) و هیچ بەهایەک ناگەڕێنێتەوە."}, {"c": "static int square(int x)\n{\n  return x * x;\n}\nstatic void Main(string[] args)\n{\n  Console.WriteLine(square(5));\n}", "o": "25", "intro": "سەرەتا لە <code>Main</code> میسۆدی <code>square</code>مان بانگ کرد و 5مان نارد. میسۆدەکە لە جۆری <code>int</code>ـە، 5 * 5 دەکات (25) و بە <code>return</code> دەیگەڕێنێتەوە. <code>Console.WriteLine</code> 25 چاپ دەکات.", "s": [["static int square(int x)", "میسۆدێک دروست دەکات بە ناوی <code>square</code>. <code>int</code> واتە ژمارەی تەواو دەگەڕێنێتەوە و <code>int x</code> ئەو ژمارەیەیە کە پێی دەدرێت.", []], ["return x * x;", "x لێک دەدات بە خۆی و ئەنجامەکە دەگەڕێنێتەوە. ئەگەر x = 5، 5 * 5 = 25.", ["x = 5 → 25"]], ["static void Main(string[] args)", "پرۆگرامەکە لێرەوە دەست پێدەکات.", []], ["Console.WriteLine(square(5));", "سەرەتا <code>square(5)</code> بانگ دەکرێت و 25 دەگەڕێتەوە. دواتر <code>Console.WriteLine</code> 25 چاپ دەکات.", []]], "sum": "پوختە: میسۆدی <code>int</code> بەهایەک دەگەڕێنێتەوە بە <code>return</code> و دەتوانرێت لە شوێنی بانگکردنەکە بەکاربهێنرێت."}]});
ADD(4,{E:[
{t:'Array Max, Min, Sum, Average – گەورەترین، بچووکترین، کۆ و تێکڕا',p:'PDF P.1',q:'<b>داواکاری:</b> بەرنامەیەکی <bdi dir="ltr">C#</bdi> بنووسە کە ١٠ ژمارەی تەواو بخوێنێتەوە و لە ڕیزێکدا (<code>array</code>) هەڵیان بگرێت. دواتر گەورەترین و بچووکترین ژمارەی ناو ڕیزەکە بدۆزەرەوە و پیشانیان بدە.',c:'int[] array = {12,23,45,67,89,32,45,65,43,22};\nConsole.WriteLine("Largest element = " + array.Max());\nConsole.WriteLine("Smallest element = " + array.Min());\nConsole.WriteLine("Sumation element = " + array.Sum());\nConsole.WriteLine("Sumation element = " + array.Average());',o:'Largest element = 89\nSmallest element = 12\nSumation element = 443\nSumation element = 44.3'},
{t:'Array alpha of 50 Elements – ڕیزی alpha بە ٥٠ شوێن',p:'PDF P.1',q:'<b>داواکاری:</b> بەرنامەیەکی <bdi dir="ltr">C#</bdi> بنووسە کە ڕیزێک بە ناوی <code>alpha</code> ڕابگەیەنێت لە ٥٠ پێکهاتەی جۆری <code>double</code>. ڕیزەکە وا پڕ بکەرەوە کە ٢٥ پێکهاتەی یەکەم یەکسان بن بە دووجای ژمارەی شوێنەکە (<code>i * i</code>)، و ٢٥ پێکهاتەی کۆتایی یەکسان بن بە سێ هێندەی ژمارەی شوێنەکە (<code>3 * i</code>). ڕیزەکە چاپ بکە بە شێوەیەک کە ١٠ بەها لە هەر هێڵێکدا بێت.',c:'// ڕیزێکی ٥٠ شوێنی double ڕادەگەیەنێت\ndouble[] alpha = new double[50];\n// ڕیزەکە پڕ دەکاتەوە\nfor (int i = 0; i < 50; i++)\n{\n  if (i < 25)\n  {\n    // ٢٥ شوێنی یەکەم: دووجای ژمارەی شوێنەکە\n    alpha[i] = i * i;\n  }\n  else\n  {\n    // ٢٥ شوێنی کۆتایی: سێ هێندەی ژمارەی شوێنەکە\n    alpha[i] = 3 * i;\n  }\n}\n// ڕیزەکە چاپ دەکات، ١٠ بەها لە هەر هێڵێک\nConsole.WriteLine("Array alpha:");\nfor (int i = 0; i < 50; i++)\n{\n  // پێش هەر بەهای دەیەم هێڵی نوێ دەکاتەوە\n  if ( i % 10 == 0)\n  {\n    Console.WriteLine();\n  }\n  // بەهاکە بە تابەوە چاپ دەکات\n  Console.Write(alpha[i]+ "\\t");\n}\nConsole.WriteLine(); // هێڵی نوێی کۆتایی',o:'Array alpha:\n\n0\t1\t4\t9\t16\t25\t36\t49\t64\t81\t\n100\t121\t144\t169\t196\t225\t256\t289\t324\t361\t\n400\t441\t484\t529\t576\t75\t78\t81\t84\t87\t\n90\t93\t96\t99\t102\t105\t108\t111\t114\t117\t\n120\t123\t126\t129\t132\t135\t138\t141\t144\t147\t'},
{t:'Odd and Even Count and Sum – ژمارە و کۆی تاک و جووت',p:'PDF P.2',q:'<b>داواکاری:</b> بەرنامەیەکی <bdi dir="ltr">C#</bdi> بنووسە کە ٢٠ ژمارەی تەواو بە <code>Console.ReadLine()</code> بخوێنێتەوە و بیانخاتە ناو ڕیزێک. بەرنامەکە دەبێت:<br>١- هەموو ژمارە تاکەکانی ڕیزەکە پیشان بدات.<br>٢- ژمارەی ژمارە تاکەکان و کۆیان بژمێرێت و پیشان بدات.<br>٣- هەموو ژمارە جووتەکانی ڕیزەکە پیشان بدات.<br>٤- ژمارەی ژمارە جووتەکان و کۆیان بژمێرێت و پیشان بدات.',c:'int oddCount = 0, evenCount = 0,oddSum = 0, evenSum = 0,value;\nint[] array = new int[20];\n// داتا دەخوێنێتەوە بۆ ناو ڕیزەکە\nfor (int i = 0; i < 20; i++)\n{\n  Console.Write("Enter number " + (i + 1) + ": ");\n  array[i] = Convert.ToInt32(Console.ReadLine());\n}\n// کۆ و ژمارەی ڕیزەکە دەدۆزێتەوە\nfor (int i = 0; i < 20; i++)\n  if (array[i] % 2==0)\n  {\n    evenCount++;\n    evenSum += array[i];\n  }\n  else\n  {\n    oddCount++;\n    oddSum += array[i];\n  }\n  Console.WriteLine("even count is: "+evenCount);\n  Console.WriteLine("odd count is: " + oddCount);\n  Console.WriteLine("sum of even values is: "+evenSum);\n  Console.WriteLine("sum of odd values is: " + oddSum);',o:'Enter number 1: 1\nEnter number 2: 2\nEnter number 3: 3\nEnter number 4: 4\nEnter number 5: 5\nEnter number 6: 6\nEnter number 7: 7\nEnter number 8: 8\nEnter number 9: 9\nEnter number 10: 10\nEnter number 11: 11\nEnter number 12: 12\nEnter number 13: 13\nEnter number 14: 14\nEnter number 15: 15\nEnter number 16: 16\nEnter number 17: 17\nEnter number 18: 18\nEnter number 19: 19\nEnter number 20: 20\neven count is: 10\nodd count is: 10\nsum of even values is: 110\nsum of odd values is: 100'}
],EX:[
[['int[] array = {12,23,45,67,89,32,45,65,43,22};','گۆڕاوی <code>array</code> دروست دەکات لە جۆری <code>int[]</code> (ڕیزێکی ژمارەی تەواو) و ١٠ بەهای تێدا دادەنێت: 12 و 23 و 45 و 67 و 89 و 32 و 45 و 65 و 43 و 22. شوێنی یەکەم 0یە و شوێنی کۆتایی 9ە.'],['Console.WriteLine("Largest element = " + array.Max());','<code>array.Max()</code> هەموو بەهاکان دەپشکنێت و گەورەترینیان دەدۆزێتەوە: 89. دەقەکە لەگەڵ 89 دەلکێنێت و Largest element = 89 چاپ دەکات.'],['Console.WriteLine("Smallest element = " + array.Min());','<code>array.Min()</code> بچووکترین بەها دەدۆزێتەوە: 12. Smallest element = 12 چاپ دەکات.'],['Console.WriteLine("Sumation element = " + array.Sum());','<code>array.Sum()</code> هەموو بەهاکان کۆدەکاتەوە: 12+23+45+67+89+32+45+65+43+22 = 443. Sumation element = 443 چاپ دەکات.'],['Console.WriteLine("Sumation element = " + array.Average());','<code>array.Average()</code> تێکڕا دەدۆزێتەوە: 443 دابەش بە 10 (ژمارەی بەهاکان) = 44.3. ئەنجامەکە لە جۆری <code>double</code>ـە، بۆیە Sumation element = 44.3 چاپ دەکات.']],
[['double[] alpha = new double[50];','ڕیزی <code>alpha</code> دروست دەکات لە جۆری <code>double[]</code> (ڕیزی ژمارەی دەهەمی) بە ٥٠ شوێن، لە 0 تا 49. هەموو شوێنەکان بەهای 0 وەردەگرن تا دواتر پڕ دەکرێنەوە.'],['for (int i = 0; i < 50; i++)','گۆڕاوی <code>i</code> دروست دەکات لە جۆری <code>int</code> و بەهای 0ی دەداتێ. 0 کەمترە لە 50؟ بەڵێ، True، بۆیە لووپەکە دەست پێدەکات. هەر جارێک i یەک زیاد دەکات: 0 1 2 ... 49، و کاتێک دەبێتە 50 لووپەکە دەوەستێت.'],['if (i < 25)','ئەمە دیاری دەکات i لە کام بەشدایە. کاتێک i = 4، ئایا 4 &lt; 25؟ بەڵێ، True. کاتێک i = 30، ئایا 30 &lt; 25؟ نەخێر، False و دەچێتە <code>else</code>.'],['alpha[i] = i * i;','بۆ ٢٥ شوێنی یەکەم (i لە 0 تا 24)، i لێک دەدات بە خۆی و دەیخاتە شوێنی i. بۆ نموونە i = 4: 4 * 4 = 16، بۆیە alpha[4] = 16.'],['else','ئەگەرنا: کاتێک i یەکسان یان گەورەتر بێت لە 25 (i لە 25 تا 49).'],['alpha[i] = 3 * i;','i لێک دەدات بە 3 و دەیخاتە شوێنی i. بۆ نموونە i = 30: 3 * 30 = 90، بۆیە alpha[30] = 90.'],['Console.WriteLine("Array alpha:");','دەقی Array alpha: چاپ دەکات و دەچێتە هێڵی نوێ.'],['for (int i = 0; i < 50; i++)','لووپی دووەم؛ i دووبارە لە 0 دەست پێدەکات و تا 49 دەڕوات، بۆ ئەوەی هەموو شوێنەکان یەک بە یەک چاپ بکرێن.'],['if ( i % 10 == 0)','<code>%</code> ماوەی دابەشکردن دەدات. بۆ نموونە i = 10: 10 % 10 = 0، ئایا 0 == 0؟ بەڵێ، True. بەڵام i = 7: 7 % 10 = 7، ئایا 7 == 0؟ نەخێر، False. بۆیە تەنها کاتێک i = 0 و 10 و 20 و 30 و 40 ڕاستە.'],['Console.WriteLine();','هێڵێکی بەتاڵ چاپ دەکات، واتە دەچێتە هێڵی نوێ. لە i = 0 هێڵێکی بەتاڵ دوای Array alpha: دروست دەکات و لە i = 10 و 20 و 30 و 40 هێڵێکی نوێ دەست پێدەکات.'],['Console.Write(alpha[i]+ "\\t");','بەهای alpha[i] لەگەڵ تابێک چاپ دەکات و ناچێتە هێڵی نوێ. بۆ نموونە i = 3: alpha[3] = 9، دەنووسرێت 9 و دوای ئەو تابێک.'],['Console.WriteLine();','دوای تەواوبوونی لووپ، دەچێتە هێڵی نوێ بۆ ئەوەی هێڵی کۆتایی ڕێک تەواو بێت.']],
[['int oddCount = 0, evenCount = 0,oddSum = 0, evenSum = 0,value;','پێنج گۆڕاوی <code>int</code> بە یەکجار دروست دەکات. <code>oddCount</code> و <code>evenCount</code> و <code>oddSum</code> و <code>evenSum</code> هەموویان بەهای 0 وەردەگرن، چونکە دەبێت لە 0 دەست پێبکەن بۆ ژماردن و کۆکردنەوە. <code>value</code> هێشتا بەهای نییە و لەم کۆدەدا بەکارنایەت.'],['int[] array = new int[20];','ڕیزی <code>array</code> دروست دەکات لە جۆری <code>int[]</code> (ڕیزی ژمارەی تەواو) بە ٢٠ شوێن، لە 0 تا 19. هەموو شوێنەکان بەهای 0 وەردەگرن تا دواتر پڕ دەکرێنەوە.'],['for (int i = 0; i < 20; i++)','گۆڕاوی <code>i</code> دروست دەکات لە جۆری <code>int</code> و بەهای 0ی دەداتێ. 0 کەمترە لە 20؟ بەڵێ، True. هەر جارێک i یەک زیاد دەکات: 0 1 2 ... 19، و کاتێک دەبێتە 20 لووپەکە دەوەستێت. ئەم لووپە بۆ خوێندنەوەی ٢٠ ژمارەیە.'],['Console.Write("Enter number " + (i + 1) + ": ");','دەقی Enter number لەگەڵ (i + 1) و : چاپ دەکات. بۆ نموونە i = 0: (0 + 1) = 1، بۆیە Enter number 1: چاپ دەکرێت. کەوانەکان پێویستن بۆ ئەوەی i + 1 وەک ژمارە کۆبکرێتەوە و بە دەقەکەوە نەلکێت. <code>Write</code>ـە، بۆیە بەکارهێنەر ژمارەکە لەتەنیشتی دەنووسێت.'],['array[i] = Convert.ToInt32(Console.ReadLine());','<code>ReadLine()</code> ئەوەی بەکارهێنەر نووسیویەتی وەک دەق دەخوێنێتەوە و <code>Convert.ToInt32</code> دەیکات بە ژمارەی تەواو و دەیخاتە شوێنی i لە ڕیزەکە. بۆ نموونە i = 0 و بەکارهێنەر 1 دەنووسێت: array[0] = 1. ئەگەر i = 1 و 2 بنووسێت: array[1] = 2.'],['for (int i = 0; i < 20; i++)','لووپی دووەم؛ i دووبارە لە 0 دەست پێدەکات و تا 19 دەڕوات. ئەم لووپە کەوانەی نییە، بۆیە تەنها فەرمانی <code>if ... else</code> (تا کۆتایی <code>else</code>) دووبارە دەبێتەوە. چوار <code>WriteLine</code>ـەکە دوای لووپەکەن و تەنها یەک جار جێبەجێ دەبن.'],['if (array[i] % 2==0)','<code>%</code> ماوەی دابەشکردن دەدات. بۆ نموونە array[1] = 2: 2 % 2 = 0، ئایا 0 == 0؟ بەڵێ، True، واتە جووتە. بەڵام array[0] = 1: 1 % 2 = 1، ئایا 1 == 0؟ نەخێر، False، دەچێتە <code>else</code>.'],['evenCount++;','ئەگەر ژمارەکە جووت بوو، <code>evenCount</code> یەک زیاد دەکات. بۆ نموونە لە array[1] = 2 دەبێتە 1، و دوای هەموو ژمارە جووتەکان 10 دەبێت.'],['evenSum += array[i];','ژمارەی جووت دەخاتە سەر <code>evenSum</code>. بۆ نموونە array[1] = 2: 0 + 2 = 2، دواتر 4: 2 + 4 = 6. دوای هەموویان: 2 + 4 + ... + 20 = 110.'],['else','ئەگەرنا: کاتێک ژمارەکە جووت نەبێت، واتە تاک بێت.'],['oddCount++;','ئەگەر ژمارەکە تاک بوو، <code>oddCount</code> یەک زیاد دەکات. بۆ نموونە لە array[0] = 1 دەبێتە 1، و دوای هەموو ژمارە تاکەکان 10 دەبێت.'],['oddSum += array[i];','ژمارەی تاک دەخاتە سەر <code>oddSum</code>. بۆ نموونە array[0] = 1: 0 + 1 = 1، دواتر 3: 1 + 3 = 4. دوای هەموویان: 1 + 3 + ... + 19 = 100.'],['Console.WriteLine("even count is: "+evenCount);','دەقەکە لەگەڵ بەهای evenCount بە <code>+</code> دەلکێنێت و even count is: 10 چاپ دەکات.'],['Console.WriteLine("odd count is: " + oddCount);','دەقەکە لەگەڵ بەهای oddCount دەلکێنێت و odd count is: 10 چاپ دەکات.'],['Console.WriteLine("sum of even values is: "+evenSum);','دەقەکە لەگەڵ بەهای evenSum دەلکێنێت و sum of even values is: 110 چاپ دەکات.'],['Console.WriteLine("sum of odd values is: " + oddSum);','دەقەکە لەگەڵ بەهای oddSum دەلکێنێت و sum of odd values is: 100 چاپ دەکات.']]
],EXSUM:['سەرەتا <code>array</code> دروست دەکات لە جۆری <code>int[]</code> (ڕیزێکی ژمارەی تەواو) بە ١٠ بەها: 12 و 23 و 45 و 67 و 89 و 32 و 45 و 65 و 43 و 22. دواتر <code>array.Max()</code> هەموو بەهاکان دەپشکنێت و گەورەترین دەدۆزێتەوە، 89، و Largest element = 89 چاپ دەکرێت. <code>array.Min()</code> بچووکترین دەدۆزێتەوە، 12، و Smallest element = 12 چاپ دەکرێت. <code>array.Sum()</code> هەموو بەهاکان کۆدەکاتەوە: 12 + 23 + 45 + 67 + 89 + 32 + 45 + 65 + 43 + 22 = 443، و چاپ دەکرێت. لە کۆتاییدا <code>array.Average()</code> تێکڕا دەدۆزێتەوە: 443 / 10 = 44.3، و چاپ دەکرێت.',
'سەرەتا <code>alpha</code> دروست دەکات لە جۆری <code>double[]</code> بە ٥٠ شوێن (0 تا 49)، هەموویان 0ن. لووپی یەکەم، i لە 0 تا 49 دەڕوات و لە هەر جارێکدا <code>if (i &lt; 25)</code> دەپشکنێت. بۆ i لە 0 تا 24 ڕاستە و alpha[i] = i * i، بۆ نموونە alpha[4] = 16 و alpha[24] = 576. بۆ i لە 25 تا 49، <code>else</code> بەکاردێت و alpha[i] = 3 * i، بۆ نموونە alpha[25] = 75 و alpha[30] = 90 و alpha[49] = 147. دواتر Array alpha: چاپ دەکات. لووپی دووەم هەموو بەهاکان چاپ دەکات و دوای هەر بەهایەک تابێک دەنووسێت. کاتێک <code>i % 10 == 0</code> بێت (i = 0 و 10 و 20 و 30 و 40)، <code>WriteLine()</code> هێڵی نوێ دەکاتەوە پێش چاپکردنی ئەو بەهایە، بۆیە ١٠ بەها لە هەر هێڵێکدایە و پێنج هێڵ دروست دەبن. فەرمانی کۆتایی <code>WriteLine()</code> هێڵی کۆتایی تەواو دەکات.',
'سەرەتا پێنج گۆڕاوی <code>int</code> دروست دەکات: <code>oddCount</code> و <code>evenCount</code> و <code>oddSum</code> و <code>evenSum</code> بە 0، و <code>value</code> بەبێ بەها. دواتر ڕیزی <code>array</code> دروست دەکات بە ٢٠ شوێن. لووپی یەکەم، i لە 0 تا 19 دەڕوات: هەر جارێک Enter number (i + 1): چاپ دەکات و ژمارەی بەکارهێنەر دەخاتە array[i]. بۆ نموونە ئەگەر 1 تا 20 بنووسرێن، array[0] = 1 و array[19] = 20. لووپی دووەم، i لە 0 تا 19 دەڕوات و <code>array[i] % 2 == 0</code> دەپشکنێت. بۆ ژمارەی جووت (2 و 4 و ... و 20) <code>evenCount</code> یەک زیاد دەکات و ژمارەکە دەخاتە سەر <code>evenSum</code>. بۆ ژمارەی تاک (1 و 3 و ... و 19) <code>oddCount</code> و <code>oddSum</code> گۆڕدەکرێن. لە کۆتاییدا چوار <code>WriteLine</code> ئەنجامەکان چاپ دەکەن: even count is: 10، odd count is: 10، sum of even values is: 110، و sum of odd values is: 100.'],MORE:[
{c:'int[] a = {5, 2, 9};\nConsole.WriteLine(a[1]);\nConsole.WriteLine(a.Length);',o:'2\n3',intro:'سەرەتا ڕیزی <code>a</code>مان دروست کرد بە سێ بەها: 5 و 2 و 9. دواتر بە <code>a[1]</code> بەهای شوێنی 1مان خوێندەوە کە 2ـە، چونکە شوێنەکان لە 0 دەست پێدەکەن. لە کۆتاییدا <code>a.Length</code> ژمارەی بەهاکانی دا، کە 3ـە.',s:[['int[] a = {5, 2, 9};','ڕیزی <code>a</code> دروست دەکات لە جۆری <code>int[]</code> (ڕیزی ژمارەی تەواو) و سێ بەهای تێدا دادەنێت: شوێنی 0 بەهای 5، شوێنی 1 بەهای 2، شوێنی 2 بەهای 9.',['a[0] = 5','a[1] = 2','a[2] = 9']],['Console.WriteLine(a[1]);','<code>a[1]</code> بەهای شوێنی 1 دەخوێنێتەوە، کە 2ـە، و چاپی دەکات. شوێنەکان لە 0 دەست پێدەکەن، بۆیە a[1] دووەم بەهایە.',[]],['Console.WriteLine(a.Length);','<code>a.Length</code> ژمارەی بەهاکانی ناو ڕیزەکە دەدات، کە 3ـە، و چاپی دەکات.',[]]],sum:'پوختە: ڕیز چەند بەهایەک هەڵدەگرێت و هەر بەهایەک شوێنێکی هەیە کە لە 0 دەست پێدەکات.'},
{c:'int[] n = new int[4];\nfor (int i = 0; i < 4; i++)\n  n[i] = i * 2;\nConsole.WriteLine(n[3]);',o:'6',intro:'سەرەتا ڕیزی <code>n</code>مان دروست کرد بە ٤ شوێن کە هەموویان 0ن. دواتر بە <code>for</code> i لە 0 تا 3 دەڕوات و هەر جارێک n[i] دەکات بە i * 2: 0 و 2 و 4 و 6. لە کۆتاییدا n[3]مان چاپ کرد، کە 6ـە.',s:[['int[] n = new int[4];','ڕیزی <code>n</code> دروست دەکات لە جۆری <code>int[]</code> بە ٤ شوێن (0 تا 3). هەموو شوێنەکان بەهای 0 وەردەگرن.',['n = 0 ، 0 ، 0 ، 0']],['for (int i = 0; i < 4; i++)','<code>i</code> دروست دەکات و 0ی دەداتێ. 0 کەمترە لە 4؟ بەڵێ، True. هەر جارێک i یەک زیاد دەکات: 0 1 2 3، و کاتێک دەبێتە 4 مەرجەکە هەڵەیە و لووپەکە دەوەستێت.',['i = 0 ، 1 ، 2 ، 3']],['n[i] = i * 2;','هەر جارێک i لێک دەدات بە 2 و دەیخاتە شوێنی i: n[0] = 0، n[1] = 2، n[2] = 4، n[3] = 6.',['n = 0 ، 2 ، 4 ، 6']],['Console.WriteLine(n[3]);','<code>n[3]</code> بەهای شوێنی 3 دەخوێنێتەوە، 6، و چاپی دەکات.',[]]],sum:'پوختە: لووپ دەتوانێت ڕیزێک شوێن بە شوێن پڕ بکاتەوە بە بەکارهێنانی i وەک شوێن.'},
{c:'int[] a = {3, 8, 5, 6};\nint even = 0;\nfor (int i = 0; i < 4; i++)\n  if (a[i] % 2 == 0)\n    even++;\nConsole.WriteLine(even);',o:'2',intro:'سەرەتا ڕیزی <code>a</code>مان دروست کرد بە چوار بەها: 3 و 8 و 5 و 6. دواتر <code>even</code>مان دروست کرد بە 0. بە <code>for</code> i لە 0 تا 3 دەڕوات و هەر جارێک <code>a[i] % 2 == 0</code> دەپشکنێت: تەنها 8 و 6 جووتن، بۆیە <code>even</code> دوو جار یەک زیاد دەکات و دەبێتە 2. لە کۆتاییدا 2 چاپ دەکرێت.',s:[['int[] a = {3, 8, 5, 6};','ڕیزی <code>a</code> دروست دەکات لە جۆری <code>int[]</code> و چوار بەهای تێدا دادەنێت: a[0] = 3 و a[1] = 8 و a[2] = 5 و a[3] = 6.',['a = 3 ، 8 ، 5 ، 6']],['int even = 0;','گۆڕاوی <code>even</code> دروست دەکات لە جۆری <code>int</code> و بەهای 0ی دەداتێ، بۆ ژماردنی ژمارە جووتەکان.',['even = 0']],['for (int i = 0; i < 4; i++)','<code>i</code> دروست دەکات و 0ی دەداتێ. 0 کەمترە لە 4؟ بەڵێ، True. هەر جارێک i یەک زیاد دەکات: 0 1 2 3، و کاتێک دەبێتە 4 لووپەکە دەوەستێت.',['i = 0 ، 1 ، 2 ، 3']],['if (a[i] % 2 == 0)','بۆ هەر بەهایەک ماوەی دابەشکردن بە 2 دەپشکنێت. i = 0: 3 % 2 = 1، ئایا 1 == 0؟ نەخێر، False. i = 1: 8 % 2 = 0، بەڵێ، True. i = 2: 5 % 2 = 1، False. i = 3: 6 % 2 = 0، True.',[]],['even++;','کاتێک مەرجەکە ڕاستە (i = 1 و 3)، even یەک زیاد دەکات: 0 دەبێتە 1، دواتر 2.',['even = 1 ، 2']],['Console.WriteLine(even);','<code>Console.WriteLine</code> بەهای even چاپ دەکات: 2.',[]]],sum:'پوختە: <code>%</code> لەگەڵ <code>if</code> دەتوانێت ژمارە جووتەکان جیا بکاتەوە و یەک بە یەک بیانژمێرێت.'}

ame = "ahmed".'],['string full = string.Concat(firstName+\' \', middleName+\' \', lastName);','گۆڕاوی <code>full</code> دروست دەکات لە جۆری <code>string</code>. <code>firstName+\' \'</code> بۆشاییەک (<code>char</code>) دەخاتە دوای "ali" و دەبێتە "ali "، و بە هەمان شێوە "hassan ". <code>string.Concat</code> سێ دەقەکە پێکەوە دەبەستێتەوە: "ali " + "hassan " + "ahmed" = "ali hassan ahmed".'],['Console.WriteLine(full.ToUpper());','<code>ToUpper()</code> هەموو پیتەکان دەکات بە گەورە: "ali hassan ahmed" دەبێتە "ALI HASSAN AHMED". <code>WriteLine</code> چاپی دەکات.']],[['string email = "mohammed.hassan@gpu.edu.iq";','گۆڕاوی <code>email</code> دروست دەکات لە جۆری <code>string</code> و ئیمەیلەکەی دەداتێ. ئەم دەقە 26 پیتە و شوێنی هەر پیتێک لە 0 دەست پێدەکات.'],['int atPos = email.IndexOf("@");','گۆڕاوی <code>atPos</code> دروست دەکات لە جۆری <code>int</code>. <code>IndexOf("@")</code> شوێنی یەکەم @ دەدۆزێتەوە. <code>mohammed.hassan</code> 15 پیتە (شوێنی 0 تا 14)، بۆیە @ لە شوێنی 15یە: atPos = 15.'],['string username = email.Substring(0, atPos);','<code>Substring(0, 15)</code> 15 پیت وەردەگرێت لە شوێنی 0ەوە: <code>mohammed.hassan</code>، و دەیخاتە ناو <code>username</code>. کۆمێنتی کۆتایی هێڵەکە (<code>// mohammed.hassan</code>) تەنها ئاماژەیە بۆ ئەنجامەکە.'],['string domain = email.Substring(atPos + 1);','atPos + 1 = 16، واتە دوای @. <code>Substring(16)</code> لە شوێنی 16ەوە تا کۆتایی وەردەگرێت: <code>gpu.edu.iq</code>، و دەیخاتە ناو <code>domain</code>. کۆمێنتی کۆتایی هێڵەکە تەنها ئاماژەیە بۆ ئەنجامەکە.'],['Console.WriteLine("Username: " + username);','دەقەکە لەگەڵ بەهای username دەلکێنێت و <code>Username: mohammed.hassan</code> چاپ دەکات.'],['Console.WriteLine("Domain: " + domain);','دەقەکە لەگەڵ بەهای domain دەلکێنێت و <code>Domain: gpu.edu.iq</code> چاپ دەکات.']]],EXSUM:['سەرەتا سێ گۆڕاوی <code>string</code>مان دروست کرد: <code>firstName</code> و <code>middleName</code> و <code>lastName</code>. دواتر دەقی داواکارییمان چاپ کرد و بە سێ <code>ReadLine()</code> سێ هێڵمان خوێندەوە؛ بۆ نموونە ali و hassan و ahmed. پاشان <code>firstName+\' \'</code> و <code>middleName+\' \'</code> بۆشاییەکیان بۆ زیاد کرا ("ali " و "hassan ")، و <code>string.Concat</code> لەگەڵ lastName پێکەوەی بەست: "ali hassan ahmed" و لە <code>full</code>دا هەڵگیرا. لە کۆتاییدا <code>ToUpper()</code> هەموو پیتەکانی کرد بە گەورە و <code>WriteLine</code> چاپی کرد: ALI HASSAN AHMED.','سەرەتا ئیمەیلەکەمان لە گۆڕاوی <code>email</code> هەڵگرت ("mohammed.hassan@gpu.edu.iq"، 26 پیت). دواتر <code>IndexOf("@")</code> شوێنی @ی دۆزییەوە: 15، چونکە <code>mohammed.hassan</code> 15 پیتە. پاشان <code>Substring(0, atPos)</code> 15 پیتی یەکەمی وەرگرت و بوو بە <code>username</code> ("mohammed.hassan")، و <code>Substring(atPos + 1)</code> لە شوێنی 16ەوە تا کۆتایی وەرگرت و بوو بە <code>domain</code> ("gpu.edu.iq"). لە کۆتاییدا هەردووکیان بە <code>WriteLine</code> چاپ کران.'],MORE:[{c:'string w = "Salam";\nConsole.WriteLine(w.ToLower());\nConsole.WriteLine(w.Length);',o:'salam\n5',intro:'سەرەتا گۆڕاوی <code>w</code>مان دروست کرد بە جۆری <code>string</code> و دەقی "Salam"مان تێدا دانا. دواتر <code>ToLower()</code> هەموو پیتەکانی کرد بە بچووک و چاپ کرا: salam. لە کۆتاییدا <code>Length</code> ژمارەی پیتەکانی دەقەکەی دا: 5.',s:[['string w = "Salam";','گۆڕاوی <code>w</code> دروست دەکات لە جۆری <code>string</code> و دەقی "Salam"ی دەداتێ. ئەم دەقە 5 پیتە.',['w = "Salam"']],['Console.WriteLine(w.ToLower());','<code>ToLower()</code> هەموو پیتەکان دەکات بە بچووک: "Salam" دەبێتە "salam". گۆڕاوی w خۆی ناگۆڕێت. چاپی دەکات: salam.',[]],['Console.WriteLine(w.Length);','<code>Length</code> ژمارەی پیتەکانی w دەدات: S و a و l و a و m = 5. چاپی دەکات: 5.',[]]],sum:'پوختە: <code>ToLower()</code> دەقێک بە پیتی بچووک دەگەڕێنێتەوە و <code>Length</code> درێژی دەقەکە دەدات.'},{c:'string t = "ab-cd";\nint d = t.IndexOf("-");\nConsole.WriteLine(t.Substring(0, d));\nConsole.WriteLine(t.Substring(d + 1));',o:'ab\ncd',intro:'سەرەتا گۆڕاوی <code>t</code>مان دروست کرد بە دەقی "ab-cd". دواتر <code>IndexOf("-")</code> شوێنی نیشانەی - ی دۆزییەوە: 2. پاشان <code>Substring(0, d)</code> بەشی پێش نیشانەکەی وەرگرت ("ab") و <code>Substring(d + 1)</code> بەشی دوای نیشانەکەی ("cd"). هەردووکیان لە دوو هێڵ چاپ کران.',s:[['string t = "ab-cd";','گۆڕاوی <code>t</code> دروست دەکات لە جۆری <code>string</code> و دەقی "ab-cd"ی دەداتێ. شوێنەکان: a = 0، b = 1، - = 2، c = 3، d = 4.',['t = "ab-cd"']],['int d = t.IndexOf("-");','گۆڕاوی <code>d</code> دروست دەکات لە جۆری <code>int</code>. <code>IndexOf("-")</code> شوێنی نیشانەی - دەدۆزێتەوە: 2.',['d = 2']],['Console.WriteLine(t.Substring(0, d));','<code>Substring(0, 2)</code> دوو پیت وەردەگرێت لە شوێنی 0ەوە: "ab". چاپی دەکات: ab.',[]],['Console.WriteLine(t.Substring(d + 1));','d + 1 = 3. <code>Substring(3)</code> لە شوێنی 3ەوە تا کۆتایی وەردەگرێت: "cd". چاپی دەکات: cd.',[]]],sum:'پوختە: <code>IndexOf</code> شوێنێک دەدۆزێتەوە و <code>Substring</code> بەشێک لە دەقەکە دەبڕێت.'}]});
ADD(5,{E:[{t:'Count a Letter with Method – ژماردنی پیتێک بە میسۆد',p:'PDF P.2',q:'<b>داواکاری:</b> بەرنامەیەکی <bdi dir="ltr">C#</bdi> بنووسە کە ڕستەیەک بخوێنێتەوە و ژمارەی دووبارەبوونەوەی پیتێک لە ناو ئەو ڕستەیەدا بژمێرێت. میسۆد (<code>method</code>) بەکاربهێنە.',c:'static int RetCount(string text,char ch)\n{\n  int count = 0;\n  int pos = text.IndexOf(ch);\n  while (pos != -1)\n  {\n    count++;\n    pos = text.IndexOf(ch, pos + 1); // دووبارە دوای دوایین دۆزینەوە دەگەڕێت\n  }\n  return count;\n}\nstatic void Main(string[] args)\n{\n  Console.WriteLine("Write the sentence ");\n  string text = Console.ReadLine();\n  Console.WriteLine("Enter the letter for count");\n  char ch = Console.ReadLine()[0];\n  Console.WriteLine("The letter {0} appears {1} times",ch, RetCount(text, ch));\n}',o:'Write the sentence \nbanana split\nEnter the letter for count\na\nThe letter a appears 3 times'}],EX:[[['static int RetCount(string text,char ch)','میسۆدێک دروست دەکات بە ناوی <code>RetCount</code>. <code>int</code> واتە ژمارەیەکی تەواو دەگەڕێنێتەوە. دوو پارامیتەر وەردەگرێت: <code>text</code> (<code>string</code>، دەق) و <code>ch</code> (<code>char</code>، یەک پیت). کاتێک بانگ دەکرێت بە "banana split" و \'a\': text = "banana split" و ch = \'a\'.'],['int count = 0;','گۆڕاوی <code>count</code> دروست دەکات لە جۆری <code>int</code> و بەهای 0ی دەداتێ؛ ژمارەی دۆزینەوەکانی تێدا دەژمێردرێت.'],['int pos = text.IndexOf(ch);','گۆڕاوی <code>pos</code> دروست دەکات لە جۆری <code>int</code>. <code>IndexOf(ch)</code> شوێنی یەکەم \'a\' دەدۆزێتەوە. لە "banana split": b = 0، a = 1، n = 2، a = 3، n = 4، a = 5، بۆشایی = 6. یەکەم a لە شوێنی 1یە: pos = 1. ئەگەر پیتەکە نەبێت، -1 دەگەڕێنێتەوە.'],['while (pos != -1)','لووپەکە تا pos لە -1 جیاواز بێت بەردەوامە. یەکەم جار 1 != -1 ڕاستە، True، بۆیە دەچێتە ناو لووپەکە. کاتێک pos دەبێتە -1 (پیتەکە چیتر نەماوە)، لووپەکە دەوەستێت.'],['count++;','<code>count</code> یەک زیاد دەکات: لە دووبارەبوونەوەی یەکەم 0 دەبێتە 1، دواتر 2، دواتر 3.'],['pos = text.IndexOf(ch, pos + 1);','<code>IndexOf(ch, pos + 1)</code> لە شوێنی pos + 1ەوە دەگەڕێت، واتە دوای دوایین دۆزینەوە. دووبارەبوونەوەی یەکەم: لە شوێنی 2ەوە، a لە 3 → pos = 3. دووەم: لە 4ەوە، a لە 5 → pos = 5. سێیەم: لە 6ەوە، هیچ a نییە → pos = -1، بۆیە -1 != -1 هەڵەیە و لووپەکە دەوەستێت. کۆمێنتی کۆتایی هێڵەکە ڕوونکردنەوەی ئەم کارەیە.'],['return count;','<code>return</code> بەهای count (3) دەگەڕێنێتەوە بۆ ئەو شوێنەی میسۆدەکە لێوە بانگ کرابوو.'],['static void Main(string[] args)','بەرنامەکە لێرەوە دەست پێدەکات؛ کۆدی ناو ئەم بلۆکە یەکەم جار جێبەجێ دەبێت.'],['Console.WriteLine("Write the sentence ");','دەقی <code>Write the sentence</code> چاپ دەکات و دەچێتە هێڵی نوێ، بۆ ئەوەی بەکارهێنەر ڕستەیەک بنووسێت.'],['string text = Console.ReadLine();','گۆڕاوی <code>text</code> دروست دەکات لە جۆری <code>string</code>. <code>ReadLine()</code> ڕستەکە دەخوێنێتەوە؛ ئەگەر banana split بنووسێت، text = "banana split".'],['Console.WriteLine("Enter the letter for count");','دەقی <code>Enter the letter for count</code> چاپ دەکات، بۆ ئەوەی بەکارهێنەر ئەو پیتە بنووسێت کە دەیەوێت بیژمێرێت.'],['char ch = Console.ReadLine()[0];','گۆڕاوی <code>ch</code> دروست دەکات لە جۆری <code>char</code> (یەک پیت). <code>ReadLine()</code> دەقەکە دەخوێنێتەوە و <code>[0]</code> یەکەم پیتی هەڵدەگرێت؛ ئەگەر a بنووسێت، ch = \'a\'.'],['Console.WriteLine("The letter {0} appears {1} times",ch, RetCount(text, ch));','<code>{0}</code> دەبێتە بەهای یەکەم (ch = a) و <code>{1}</code> بەهای دووەم. سەرەتا <code>RetCount(text, ch)</code> بانگ دەکرێت و 3 دەگەڕێتەوە. چاپی دەکات: <code>The letter a appears 3 times</code>.']]],EXSUM:['سەرەتا لە <code>Main</code> ڕستەیەکمان خوێندەوە لە <code>text</code>؛ بۆ نموونە "banana split"، و پیتێک لە <code>ch</code>؛ بۆ نموونە \'a\'. دواتر <code>RetCount(text, ch)</code> بانگ کرا. لە ناو میسۆدەکە <code>count</code> بوو بە 0 و <code>pos</code> یەکەم a دۆزییەوە: شوێنی 1. لووپی <code>while</code> تا pos لە -1 جیاواز بوو بەردەوام بوو: هەر جارێک <code>count++</code> کرا و <code>IndexOf(ch, pos + 1)</code> دوای دوایین دۆزینەوە گەڕا: pos بوو بە 1 و 3 و 5، و دواتر -1 چونکە هیچ a ی تر نەما. بۆیە count بوو بە 3 و بە <code>return</code> گەڕایەوە بۆ Main. لە کۆتاییدا <code>The letter a appears 3 times</code> چاپ کرا.'],MORE:[{c:'string w = "level";\nint pos = w.IndexOf(\'e\');\nConsole.WriteLine(pos);\nConsole.WriteLine(w.IndexOf(\'e\', pos + 1));',o:'1\n3',intro:'سەرەتا گۆڕاوی <code>w</code>مان دروست کرد بە دەقی "level". دواتر <code>IndexOf(\'e\')</code> شوێنی یەکەم e ی دۆزییەوە: 1، و چاپ کرا. پاشان <code>IndexOf(\'e\', pos + 1)</code> لە شوێنی 2ەوە گەڕا و e ی دووەمی لە شوێنی 3 دۆزییەوە: 3.',s:[['string w = "level";','گۆڕاوی <code>w</code> دروست دەکات لە جۆری <code>string</code> و دەقی "level"ی دەداتێ. شوێنەکان: l = 0، e = 1، v = 2، e = 3، l = 4.',['w = "level"']],['int pos = w.IndexOf(\'e\');','گۆڕاوی <code>pos</code> دروست دەکات لە جۆری <code>int</code>. <code>IndexOf(\'e\')</code> شوێنی یەکەم e دەدۆزێتەوە: 1.',['pos = 1']],['Console.WriteLine(pos);','<code>Console.WriteLine</code> بەهای pos چاپ دەکات: 1.',[]],['Console.WriteLine(w.IndexOf(\'e\', pos + 1));','pos + 1 = 2. <code>IndexOf(\'e\', 2)</code> لە شوێنی 2ەوە e دەگەڕێت و لە شوێنی 3 دەیدۆزێتەوە. چاپی دەکات: 3.',[]]],sum:'پوختە: <code>IndexOf(پیت، شوێن)</code> دەتوانێت لە شوێنێکی دیاریکراوەوە بگەڕێت، بۆیە بۆ ژماردنی دووبارەبوونەوەکان بەکاردێت.'}]});

const LX=/((?:\d+(?:\s*→\s*\d+)+)|(?:[A-Za-z0-9_]+(?:\s*(?:&lt;|&gt;|&amp;|[=!|+\-*\/%÷×])+\s*[A-Za-z0-9_]+)+)|(?:[A-Za-z][A-Za-z0-9_]*(?: [A-Za-z][A-Za-z0-9_]*)*[.!?]?))/g;
function fx(h){let sk=0;return String(h).split(/(<[^>]+>)/).map(p=>{if(p[0]==='<'){if(/^<code[\s>]/.test(p))sk++;else if(p==='</code>')sk--;return p;}return sk>0?p:p.replace(LX,'<bdi dir="ltr">$1</bdi>');}).join('');}
function tfx(t){t=String(t);const e=x=>x.replace(/&/g,'&amp;'),m=t.match(/^(.*?) – (.*)$/);if(m)return '<bdi dir="ltr">'+e(m[1])+'</bdi> – '+fx(e(m[2]));return /[\u0600-\u06FF]/.test(t)?fx(e(t)):'<bdi dir="ltr">'+e(t)+'</bdi>';}
const li=(r,sn,tx)=>`<li><span class="rng">${r==='💡'?r:'هێڵی '+r}</span><span>${sn?`<b class="sn${sn.length>=25?' xs':sn.length>13?' sm':''}">${esc(sn)}</b> : `:''}${fx(tx)}</span></li>`;
function expl(e,items){const L=e.c.split('\n'),cl=[],cm=[];
 L.forEach((l,i)=>{const t=l.trim();if(!t)return;if(t.startsWith('//'))cm.push(i+1);else cl.push({i:i+1,t:t.replace(/\s*\/\/.*$/,'').trim()});});
 let o='';
 if(cm.length){let s=cm[0],p=s;const r=[];
  for(let k=1;k<cm.length;k++){if(cm[k]===p+1)p=cm[k];else{r.push(s===p?s:s+'-'+p);s=p=cm[k];}}
  r.push(s===p?s:s+'-'+p);
  o+=li(r.join('، '),'// کۆمێنت','ئەم هێڵانە کۆمێنتن؛ جێبەجێ ناکرێن و هیچ چاپ ناکرێن، تەنها بۆ خوێندنەوەی مرۆڤن.');}
 const map={},extra=[];let cur=0;
 for(const [sn,tx] of items){if(!sn){extra.push(tx);continue;}
  let f=-1;for(let k=cur;k<cl.length;k++){if(cl[k].t===sn.trim()){f=k;break;}}
  if(f<0){extra.push(tx);continue;}map[f]=tx;cur=f+1;}
 cl.forEach((c,k)=>{const tx=map[k]||(c.t==='{'?'دەستپێکی بلۆکی کۆد؛ کۆدەکانی دوای ئەمە ئەندامی ئەم بلۆکەن.':c.t==='}'?'کۆتایی بلۆکی کۆد؛ بلۆکەکە دادەخات.':'—');o+=li(c.i,c.t,tx);});
